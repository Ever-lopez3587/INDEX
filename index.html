<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario y Escaneo - WTW</title>
    <!-- Bootstrap CSS para un diseño limpio y responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .scan-box { font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4 text-center">Control de Inventario y Escaneo</h2>
        
        <!-- Alerta de estado de sincronización del catálogo -->
        <div id="loading-catalog" class="alert alert-info" role="alert">
            Cargando y sincronizando catálogo local... Por favor espere.
        </div>

        <!-- Interfaz de escaneo -->
        <div class="mb-3">
            <label for="codigoInput" class="form-label">Código de Barras / Artículo:</label>
            <input type="text" id="codigoInput" class="form-control form-control-lg scan-box" placeholder="Escanee o ingrese el código..." autofocus disabled>
        </div>

        <div class="mb-3">
            <label for="descripcionInput" class="form-label">Descripción:</label>
            <input type="text" id="descripcionInput" class="form-control" readonly placeholder="La descripción aparecerá aquí automáticamente">
        </div>

        <div class="mb-3">
            <label for="cantidadInput" class="form-label">Cantidad:</label>
            <input type="number" id="cantidadInput" class="form-control" value="1" min="1">
        </div>

        <!-- Botón de finalización y envío -->
        <button id="btnTerminar" class="btn btn-success w-100 btn-lg mt-3" disabled>Terminar este envío</button>
    </div>

    <script>
        let catalogoMap = new Map();
        
        // URL de tu Web App de Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyqZ02CU8u7U3E9rKhiNcSEZYQRNmDge0n5ET0UEBBRp_RbplKWlwwWdZufembphe_T/exec?accion=catalogo";

        document.addEventListener("DOMContentLoaded", function() {
            // Cargar catálogo al iniciar la interfaz
            cargarCatalogoCompleto();

            const codigoInput = document.getElementById('codigoInput');
            codigoInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    processScan(codigoInput.value.trim());
                }
            });

            document.getElementById('btnTerminar').addEventListener('click', function() {
                ejecutarEnvio();
            });
        });

        /**
         * Carga el catálogo completo utilizando sessionStorage para evitar consultas repetitivas al servidor.
         */
        function cargarCatalogoCompleto() {
            const cachedData = sessionStorage.getItem('catalogo_inventario');
            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    catalogoMap = new Map(parsed);
                    activarInterfaz();
                    console.log("Catálogo cargado exitosamente desde sessionStorage.");
                    return;
                } catch (e) {
                    console.warn("Error al leer la caché, recargando desde el servidor...", e);
                    sessionStorage.removeItem('catalogo_inventario');
                }
            }

            // Petición directa mediante Fetch a tu Apps Script
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        // .slice(1) se salta la primera fila de encabezados ["Código", "Descripción"]
                        const filasDatos = data.slice(1);
                        catalogoMap = new Map(filasDatos);
                    } else {
                        throw new Error("El formato de datos recibido no es válido.");
                    }
                    
                    // Guardar en sessionStorage para futuras consultas instantáneas
                    sessionStorage.setItem('catalogo_inventario', JSON.stringify(Array.from(catalogoMap.entries())));
                    activarInterfaz();
                    console.log("Catálogo descargado y guardado en caché local.");
                })
                .catch(error => {
                    const loadingDiv = document.getElementById('loading-catalog');
                    loadingDiv.className = "alert alert-danger";
                    loadingDiv.innerText = "Error al cargar el catálogo: " + (error.message || error);
                });
        }

        /**
         * Habilita los campos de entrada una vez cargado el catálogo.
         */
        function activarInterfaz() {
            const loadingDiv = document.getElementById('loading-catalog');
            loadingDiv.className = "alert alert-success";
            loadingDiv.innerText = "Catálogo listo y sincronizado.";
            document.getElementById('codigoInput').disabled = false;
            document.getElementById('btnTerminar').disabled = false;
            document.getElementById('codigoInput').focus();
        }

        /**
         * Búsqueda optimizada O(1) utilizando el Map local en memoria.
         */
        function buscarDescripcion(codigo) {
            if (catalogoMap.has(codigo)) {
                return catalogoMap.get(codigo);
            }
            return "Artículo no encontrado";
        }

        /**
         * Procesa el código escaneado.
         */
        function processScan(codigo) {
            if (!codigo) return;
            const descripcion = buscarDescripcion(codigo);
            document.getElementById('descripcionInput').value = descripcion;
            
            console.log(`Código escaneado: ${codigo} -> ${descripcion}`);
            
            // Limpiar y enfocar para el siguiente escaneo continuo
            const codigoInput = document.getElementById('codigoInput');
            codigoInput.value = '';
            codigoInput.focus();
        }

        /**
         * Ejecuta el envío de datos o la transmisión de correo con el botón respectivo.
         */
        function ejecutarEnvio() {
            const btn = document.getElementById('btnTerminar');
            btn.disabled = true;
            btn.innerText = "Procesando envío...";

            // Aquí puedes agregar la lógica para enviar tus datos registrados
            setTimeout(() => {
                alert("Envío completado exitosamente.");
                btn.disabled = false;
                btn.innerText = "Terminar este envío";
                document.getElementById('codigoInput').focus();
            }, 1000);
        }
    </script>
</body>
</html>
